global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: api-gateway
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: n8n-probe
    metrics_path: /probe
    params:
      module: ["http_2xx"]
    static_configs:
      - targets: ["http://n8n:5678/healthz"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: user-service
    metrics_path: /metrics
    static_configs:
      - targets: ["user-service:8000"]

  - job_name: task-service
    metrics_path: /metrics
    static_configs:
      - targets: ["task-service:8000"]

  - job_name: notification-service
    metrics_path: /metrics
    static_configs:
      - targets: ["notification-service:8000"]

  - job_name: mcp-server
    metrics_path: /metrics
    static_configs:
      - targets: ["mcp-server:8000"]

  - job_name: producer-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["producer-agent:8000"]

  - job_name: consumer-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["consumer-agent:8000"]
