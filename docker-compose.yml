services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    ports:
      - "8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/soa-realm.json:/opt/keycloak/data/import/soa-realm.json:ro
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - todo-net

  keycloak-idp-setup:
    image: quay.io/keycloak/keycloak:26.8.2
    entrypoint: ["/bin/bash", "/configure-atlassian.sh"]
    profiles: ["idp-setup"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      ATLASSIAN_CLIENT_ID: ${ATLASSIAN_CLIENT_ID:-}
      ATLASSIAN_CLIENT_SECRET: ${ATLASSIAN_CLIENT_SECRET:-}
    volumes:
      - ./keycloak/configure-atlassian.sh:/configure-atlassian.sh:ro
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - todo-net

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - todo-net

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    ports:
      - "8001:8000"
    environment: &auth-environment
      TZ: Europe/Kiev
      DATA_DIR: /data
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8081/realms/soa}
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/soa/protocol/openid-connect/certs
      CORS_ORIGINS: ${CORS_ORIGINS:-https://cad.kpi.ua,http://localhost:3000,http://localhost:6274,http://127.0.0.1:6274}
    volumes:
      - user_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - todo-net

  task-service:
    build:
      context: .
      dockerfile: task-service/Dockerfile
    ports:
      - "8002:8000"
    environment:
      <<: *auth-environment
      TZ: Europe/Kiev
      DATA_DIR: /data
      SAGA_TIMEOUT_SECONDS: "10"
    volumes:
      - task_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - todo-net

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "8003:8000"
    environment:
      <<: *auth-environment
      TZ: Europe/Kyiv
      DATA_DIR: /data
    volumes:
      - notification_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - todo-net

  mcp-server:
    build:
      context: .
      dockerfile: ai-integration/Dockerfile
    command: ["uvicorn", "mcp_server:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8004:8000"
    environment:
      <<: *auth-environment
    depends_on:
      - user-service
      - task-service
      - notification-service
    networks:
      - todo-net

  consumer-agent:
    build:
      context: .
      dockerfile: ai-integration/Dockerfile
    command: ["uvicorn", "a2a_agent:consumer_app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8011:8000"
    environment:
      <<: *auth-environment
      AGENT_ROLE: consumer
      A2A_PUBLIC_URL: http://localhost:8011
    depends_on:
      - user-service
      - notification-service
    networks:
      - todo-net

  producer-agent:
    build:
      context: .
      dockerfile: ai-integration/Dockerfile
    command: ["uvicorn", "a2a_agent:producer_app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8010:8000"
    environment:
      <<: *auth-environment
      AGENT_ROLE: producer
      A2A_PUBLIC_URL: http://localhost:8010
      CONSUMER_AGENT_URL: http://consumer-agent:8000
      CONSUMER_AGENT_INTERNAL_RPC_URL: http://consumer-agent:8000/a2a/jsonrpc
      DATA_DIR: /data
      AI_DAILY_TOKEN_LIMIT: "20000"
      AI_FUNCTION_CALLING_MODE: ${AI_FUNCTION_CALLING_MODE:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - ai_usage_data:/data
    depends_on:
      - user-service
      - task-service
      - notification-service
      - consumer-agent
    networks:
      - todo-net

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - task-service
      - notification-service
      - producer-agent
    networks:
      - todo-net

networks:
  todo-net:
    driver: bridge

volumes:
  keycloak_data:
  rabbitmq_data:
  user_data:
  task_data:
  notification_data:
  ai_usage_data: